name: myenv
version: 1.0.0
description: ngicks's user-scope environment, installed with apm install -g.
author: ngicks
# Which agent platforms to deploy to.
# Resolution order: --target flag > this field > auto-detect from filesystem.
# Accepted values: agent-skills, antigravity, claude, codex, copilot, cursor, gemini, grok-build, kiro, opencode, windsurf
targets:
  - claude
  - codex
  - opencode
dependencies:
  apm:
    - git: github.com/ngicks/agents-package
      path: mods/statusline
      targets:
        - claude
    - git: github.com/ngicks/agents-package
      path: vpkg/instructions/ngicks.base.env.instructions.md
    - git: github.com/ngicks/agents-package
      path: vpkg/instructions/ngicks.base.preference.instructions.md
    - git: github.com/ngicks/crabswarm
      path: mods/handle-events
      targets:
        - claude
    - git: github.com/ngicks/crabswarm
      path: apm-package/crabswarm-mcp-shared
  mcp: []
scripts: {}
