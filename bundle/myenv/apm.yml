name: myenv
version: 1.0.0
description: ngicks's user-scope environment, installed with apm install -g.
author: ngicks
targets:
  - claude
  - codex
  - opencode
dependencies:
  apm:
    - git: github.com/ngicks/agents-package
      path: mods/statusline
      targets:
        - claude
    - git: github.com/ngicks/agents-package
      path: pkg/hk-setup
    - git: github.com/ngicks/agents-package
      path: vpkg/instructions/ngicks.base.doc.instructions.md
    - git: github.com/ngicks/agents-package
      path: vpkg/instructions/ngicks.base.commit.instructions.md
    - git: github.com/ngicks/agents-package
      path: vpkg/instructions/ngicks.base.change.instructions.md
    - git: github.com/ngicks/agents-package
      path: vpkg/hooks/agents-simple-automation
    - git: github.com/ngicks/agents-package
      path: vpkg/skills/ngcommit
    - git: github.com/ngicks/agents-package
      path: vpkg/skills/ngplan
    - git: github.com/ngicks/crabswarm
      path: mods/handle-events
      targets:
        - claude
    - git: github.com/ngicks/crabswarm
      path: apm-package/crabswarm-mcp-shared
  mcp: []
scripts: {}
